name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VER="$(printf '%s' "$JAVA_VER_LINE" | sed -n 's/.*version "\([^"]*\)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Failed to detect active Java version from output: $JAVA_VER_LINE"
            exit 1
          fi
          if [[ "$RAW_VER" == 1.* ]]; then
            MAJOR_VER="$(printf '%s' "$RAW_VER" | cut -d. -f2)"
          else
            MAJOR_VER="$(printf '%s' "$RAW_VER" | cut -d. -f1 | cut -d- -f1 | cut -d+ -f1)"
          fi
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine Java major version from '$RAW_VER'."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="keytool"
          if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          fi
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to create ./debug.keystore using $KEYTOOL_BIN."
              exit 1
            fi
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::./debug.keystore does not exist after generation."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK does not exist at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" | sort || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing or empty: $SOURCE_APK"
            exit 1
          fi
          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[.-]+//; s/[.-]+$//')"
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          STAGING_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-asset.XXXXXX")"
          ASSET_PATH="${STAGING_DIR}/${ASSET_FILENAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed at $ASSET_PATH"
            exit 1
          fi
          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_filename=${ASSET_FILENAME}"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release asset is missing, empty, or not an .apk file: ${ASSET_PATH:-<empty>}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Asset filename: ${ASSET_FILENAME}

          Intended for testing only. This APK is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )"

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "Confirming published GitHub Release..."
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"
            {
              echo "### Debug APK Build & Release Published"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_FILENAME}\`"
              echo "- **GitHub Release URL:** ${RELEASE_URL}"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and Actions artifact upload succeeded."
            echo "Warning: GitHub Release publishing failed."
            echo "The debug APK build succeeded and the GitHub Actions artifact named 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, so no GitHub Release URL was created for this run."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available in this workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
